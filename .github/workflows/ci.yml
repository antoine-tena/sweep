name: CI

# Les workflows réutilisables vivent dans kiln (antoine-tena/kiln, public) : ils évoluent pour
# tous les projets à la fois. Le projet ne garde ici que ses paramètres.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    uses: antoine-tena/kiln/.github/workflows/python.yml@develop
    with:
      dossier: backend

  charte:
    uses: antoine-tena/kiln/.github/workflows/charte.yml@develop

  securite:
    uses: antoine-tena/kiln/.github/workflows/securite.yml@develop
    with:
      uv: "backend"
      pnpm: ""
