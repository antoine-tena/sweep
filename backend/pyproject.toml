[project]
name = "sweep"
version = "0.1.0"
description = "Trouve ce qui encombre la RAM et le swap (agents oubli\u00e9s, serveurs orphelins) et propose quoi tuer, sous Linux, WSL, macOS et Windows."
requires-python = ">=3.14"
dependencies = [
    "psutil>=7.2.2,<8.0.0",
]

# The installed command: `uv run sweep` in backend/, or `uv tool install --editable backend`.
[project.scripts]
sweep = "sweep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sweep"]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3.0.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.1,<0.18.0",
    "types-psutil>=7.2.2,<8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "ANN"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["sweep"]
